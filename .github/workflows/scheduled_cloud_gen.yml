name: Scheduled Cloud Video Generation

on:
  schedule:
    # 4x daily: 00:00, 06:00, 12:00, 18:00 UTC (staggered from local pipeline)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Optional: Force specific topic ID (leave empty to claim next available)'
        required: false
        default: ''
      engine:
        description: 'Visual generation engine'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - pollinations
          - pil

jobs:
  generate-short:
    name: Generate & Publish Short
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Environment Secrets Configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, sys
          required = [
              'GEMINI_API_KEY', 'TURSO_DB_URL', 'TURSO_AUTH_TOKEN',
              'POLLINATIONS_API_KEY', 'GDRIVE_SERVICE_ACCOUNT_JSON',
              'GDRIVE_FOLDER_ID', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID'
          ]
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              print(f'ERROR: Missing required secrets: {missing}', file=sys.stderr)
              sys.exit(1)
          print(f'All {len(required)} required environment secrets confirmed present.')
          "

      - name: Execute Cloud Video Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOPIC_ARG=""
          if [ -n "${{ github.event.inputs.topic_id }}" ]; then
            TOPIC_ARG="--topic-id ${{ github.event.inputs.topic_id }}"
          fi
          ENGINE_ARG="--engine ${{ github.event.inputs.engine || 'auto' }}"
          python scripts/run_cloud_scheduled.py $TOPIC_ARG $ENGINE_ARG
